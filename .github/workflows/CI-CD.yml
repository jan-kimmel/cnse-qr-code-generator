name: CI-CD

on:
  push:

env:
  JAVA_VERSION: '25'
  DOCKER_IMAGE_BACKEND: 'gcr.io/cnse-qr-code-generator/backend'
  DOCKER_IMAGE_FRONTEND: 'gcr.io/cnse-qr-code-generator/frontend'
  FIREBASE_CREDENTIALS_B64: ${{ secrets.FIREBASE_CREDENTIALS_B64 }}
  GCP_SA_KEY_B64: ${{ secrets.GCP_SA_KEY_B64 }}
  PORT: 8080
  ALLOWED_ORIGINS: http://localhost:8081

jobs:
  build-test-deploy:
    name: Build, Test & Deploy
    runs-on: ubuntu-24.04
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven
      
      - name: Make mvnw executable
        run: chmod +x backend/mvnw

      - name: Create Firebase credentials for local tests
        run: |
          mkdir -p backend/firebase
          echo "${{ env.FIREBASE_CREDENTIALS_B64 }}" | base64 -d > backend/firebase/cnse-qr-code-generator-firebase.json

      - name: Build Backend
        working-directory: ./backend
        run: ./mvnw clean package -DskipTests

      - name: Run Backend Tests
        working-directory: ./backend
        run: ./mvnw test

      - name: Cleanup Firebase credentials
        if: always()
        run: rm -f backend/firebase/cnse-qr-code-generator-firebase.json

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: backend/target/surefire-reports/

      - name: Build Frontend
        working-directory: ./frontend
        run: |
          if [ -f package.json ]; then
            npm install
            npm run build
          else
            echo "No frontend build found, skipping..."
          fi

      - name: Verify Frontend Build
        run: |
          if [ ! -d "frontend/dist" ] && [ ! -d "frontend/public" ]; then
            echo "Error: Frontend build not found"
            exit 1
          fi
          echo "Frontend verified"

      - name: Authenticate with Google Cloud
        run: |
          echo "${{ secrets.GCP_SA_KEY_B64 }}" | base64 -d > gcp-key.json
          gcloud auth activate-service-account --key-file=gcp-key.json
          rm -f gcp-key.json

      - name: Configure Docker for GCP
        run: gcloud auth configure-docker
      
      - name: Configure gcloud project
        run: gcloud config set project cnse-qr-code-generator

      - name: Build & Push Backend Docker Image
        run: |
          docker build -t ${{ env.DOCKER_IMAGE_BACKEND }}:latest ./backend
          docker push ${{ env.DOCKER_IMAGE_BACKEND }}:latest

      - name: Build & Push Frontend Docker Image
        run: |
          docker build -t ${{ env.DOCKER_IMAGE_FRONTEND }}:latest ./frontend
          docker push ${{ env.DOCKER_IMAGE_FRONTEND }}:latest
      
      - name: Deploy Backend to Cloud Run
        run: |
          gcloud run deploy backend-service \
            --image ${{ env.DOCKER_IMAGE_BACKEND }}:latest \
            --platform managed \
            --region europe-west1 \
            --allow-unauthenticated \
            --set-secrets="/secrets/firebase/credentials.json=firebase-credentials:latest" \
            --set-env-vars="SPRING_PROFILES_ACTIVE=prod,GCP_PROJECT_ID=cnse-qr-code-generator,GCS_BUCKET=cnse-qr-code-generator-qr-codes,FIREBASE_CREDENTIALS_PATH=/secrets/firebase/credentials.json,ALLOWED_ORIGINS=https://frontend-service-162846799968.europe-west1.run.app"

      - name: Deploy Frontend to Cloud Run
        run: |
          gcloud run deploy frontend-service \
            --image ${{ env.DOCKER_IMAGE_FRONTEND }}:latest \
            --platform managed \
            --region europe-west1 \
            --allow-unauthenticated \
            --port=80 \
            --set-env-vars="BACKEND_URL=https://backend-service-162846799968.europe-west1.run.app"
